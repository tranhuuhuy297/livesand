name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck, unit, build, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck (web + server)
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build web app and relay
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Headless Chromium runs WebGPU on SwiftShader (CPU), so no GPU runner is needed.
      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload e2e screenshots and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            e2e-screens/
            test-results/
          retention-days: 7
