name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck, unit, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck (web + server)
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build web app and relay
        run: npm run build

      # End-to-end tests run locally only (`npm run test:e2e`): on GPU-less runners WebGPU is emulated on the CPU
      # and the suite takes ~40 min. To run them in CI again, uncomment the steps below and raise timeout-minutes to 75.
